server.port=9000
spring.application.name=workshop-ai

# Database
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=workshop;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Workshop@2026!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.table=WORKSHOP_MIGRATION_SCHEMA
spring.flyway.locations=classpath:db/migration
spring.flyway.sql-migration-prefix=
spring.flyway.baselineOnMigrate=true

# Virtual Threads
spring.threads.virtual.enabled=true
spring.main.banner-mode=off

# Docker Compose
spring.docker.compose.file=classpath:compose.yml

# Actuator
management.endpoints.web.exposure.include=health,prometheus

# Springdoc
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
